[package]
name = "wacore-signal-runtime"
version = "0.7.0"
edition.workspace = true
license = "MIT"
rust-version.workspace = true
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "Runtime adapters for storage-compatible sans-I/O Signal transitions"

[features]
legacy-session-interop = []

[dependencies]
wacore-signal-engine = { path = "../signal-engine", version = "0.7.0" }
aes.workspace = true
aes-gcm.workspace = true
cbc = { workspace = true, features = ["block-padding"] }
ctr.workspace = true
sha1.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
subtle.workspace = true
zeroize.workspace = true
curve25519-dalek = { version = "5.0.0", features = ["zeroize"] }
rand.workspace = true
serde.workspace = true
bytes.workspace = true
thiserror.workspace = true
async-trait.workspace = true
async-lock.workspace = true
portable-atomic.workspace = true
chrono.workspace = true
hex.workspace = true
wacore-binary.workspace = true
wacore-derive.workspace = true
waproto.workspace = true
buffa.workspace = true
log.workspace = true

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
serde_json.workspace = true

[lints]
workspace = true
