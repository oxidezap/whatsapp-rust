[package]
name = "wacore-recordstore"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Polymorfa (Softium LLC)"]
license = "MIT"
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "Fenced, sealed record storage for wacore Signal state"
publish = false

[features]
# Reusable checks every RecordStore implementation must pass. Adapter crates
# enable it in their dev-dependencies and call `conformance::run_all`.
conformance = []

[dependencies]
aes-gcm = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
rand = { workspace = true }
thiserror = { workspace = true }
wacore = { workspace = true }

[dev-dependencies]
futures = { workspace = true, features = ["executor"] }
