[package]
name = "wacore-libsignal"
version = "0.7.0"
edition.workspace = true
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT AND BSD-3-Clause"
rust-version.workspace = true
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "Storage-compatible Signal protocol with a sans-I/O state engine"

[features]
legacy-session-interop = ["dep:wacore-derive"]
bench-internals = []

[dependencies]
arrayvec = { version = "0.7.8", default-features = false }
aes.workspace = true
aes-gcm.workspace = true
cbc = { workspace = true, features = ["block-padding"] }
ctr.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
subtle.workspace = true
zeroize.workspace = true
rand.workspace = true
serde.workspace = true
bytes.workspace = true
thiserror.workspace = true
async-trait.workspace = true
async-lock.workspace = true
portable-atomic.workspace = true
chrono = { workspace = true, features = ["now"] }
hex.workspace = true
itoa.workspace = true
wacore-binary.workspace = true
# Only the opt-in legacy wire enums use the derive macro.
wacore-derive = { workspace = true, optional = true }
waproto.workspace = true
buffa.workspace = true
log.workspace = true

[dev-dependencies]
syn = { version = "3.0", features = ["full", "visit"] }
ciborium = "0.2"
divan.workspace = true
futures = { workspace = true, features = ["executor"] }
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "rewrite_benchmark"
harness = false

[[bench]]
name = "classic_benchmark"
harness = false

[[bench]]
name = "curve_benchmark"
harness = false
