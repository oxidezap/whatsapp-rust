[package]
name = "wacore-libsignal"
version = "0.7.0"
edition.workspace = true
authors = ["João Lucas <jlucaso@hotmail.com>"]
license = "MIT"
rust-version.workspace = true
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "Storage-compatible Signal protocol with a sans-I/O state engine"

[features]
legacy-session-interop = []

[dependencies]
aes.workspace = true
aes-gcm.workspace = true
cbc = { workspace = true, features = ["block-padding"] }
ctr.workspace = true
sha2.workspace = true
hmac.workspace = true
hkdf.workspace = true
subtle.workspace = true
zeroize.workspace = true
curve25519-dalek = { version = "5.0.0", features = ["zeroize"] }
rand.workspace = true
serde.workspace = true
bytes.workspace = true
thiserror.workspace = true
async-trait.workspace = true
async-lock.workspace = true
portable-atomic.workspace = true
chrono = { workspace = true, features = ["now"] }
hex.workspace = true
wacore-binary.workspace = true
wacore-derive.workspace = true
waproto.workspace = true
buffa.workspace = true
log.workspace = true

[dev-dependencies]
syn = { version = "3.0", features = ["full", "visit"] }
ciborium = "0.2"
divan.workspace = true
futures = { workspace = true, features = ["executor"] }
serde_json.workspace = true

[lints]
workspace = true

[[bench]]
name = "rewrite_benchmark"
harness = false
