[package]
name = "wacore-signal-ops"
version = "0.1.0"
edition = "2024"
rust-version.workspace = true
authors = ["Polymorfa (Softium LLC)"]
license = "MIT"
repository = "https://github.com/oxidezap/whatsapp-rust"
description = "Signal operations for a WhatsApp linked device whose keys live outside the client"
publish = false

[dependencies]
anyhow = { workspace = true }
async-lock = { workspace = true }
async-trait = { workspace = true }
bytes = { workspace = true }
hex = { workspace = true }
rand = { workspace = true }
serde = { workspace = true }
sha2 = { workspace = true }
thiserror = { workspace = true }
wacore = { workspace = true }
wacore-binary = { workspace = true }
wacore-recordstore = { path = "../recordstore" }
waproto = { workspace = true }

[dev-dependencies]
anyhow = { workspace = true }
tokio = { workspace = true, features = ["macros", "rt", "rt-multi-thread", "sync", "time"] }
buffa = { workspace = true }
futures = { workspace = true, features = ["executor"] }
hmac = { workspace = true }
sha2 = { workspace = true }
wacore = { workspace = true, features = ["test-util"] }
