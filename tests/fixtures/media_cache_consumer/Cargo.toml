[package]
name = "media-cache-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]

[dependencies]
whatsapp-rust = { path = "../../..", default-features = false }

[dev-dependencies]
serde_json = "1.0"

# Each mode is independently expected to fail for one precise API restriction.
[features]
old-image-literal = []
old-video-literal = []
old-document-literal = []
old-audio-literal = []
old-catalog-literal = []
old-collection-literal = []
old-cache-config-literal = []
old-cache-entry-literal = []
old-cache-stores-literal = []
exhaustive-product-availability = []
