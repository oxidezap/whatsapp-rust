# Standalone host fixture: no workspace dependency aliases.
[package]
name = "sqlite-api-consumer"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]

[dependencies]
whatsapp-rust = { path = "../..", default-features = false, features = ["sqlite-storage-bundled"] }

[target.'cfg(not(target_family = "wasm"))'.dev-dependencies]
tokio = { version = "1.53.1", features = ["macros", "rt"] }
