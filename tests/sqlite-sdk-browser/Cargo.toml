# No direct storage or wacore dependency may supply the SDK's missing js edge.
[package]
name = "sqlite-sdk-browser"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false

[workspace]
resolver = "3"

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
whatsapp-rust = { path = "../..", default-features = false, features = ["sqlite-storage", "js"] }

[target.'cfg(not(target_family = "wasm"))'.dependencies]
whatsapp-rust = { path = "../..", default-features = false, features = ["sqlite-storage-bundled"] }
tokio = { version = "1.53.1", features = ["macros", "rt"] }

[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.129"
wasm-bindgen-futures = "=0.4.79"

[target.'cfg(target_family = "wasm")'.dev-dependencies]
wasm-bindgen-test = "=0.3.79"
