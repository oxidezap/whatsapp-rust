[package]
name = "event-consumer"
version = "0.0.0"
edition = "2024"
publish = false
rust-version = "1.94"

[workspace]

[features]
default = ["native-tests"]
native-tests = ["whatsapp-rust/tokio-runtime", "dep:tokio"]

[dependencies]
whatsapp-rust = { path = "../..", default-features = false }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"], optional = true }
