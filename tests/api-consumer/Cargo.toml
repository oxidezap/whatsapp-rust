# Kept outside the root workspace: dev-dependency feature unification must not
# make a minimal downstream profile compile by accident.
[package]
name = "api-consumer"
version = "0.0.0"
edition = "2024"
rust-version = "1.94"
publish = false
autobins = false

[workspace]
resolver = "3"

[features]
default = []
core = []
contracts = []
sdk = ["dep:whatsapp-rust"]
native = ["sdk", "whatsapp-rust/tokio-runtime", "dep:tokio", "dep:anyhow", "dep:async-channel", "dep:async-trait"]
plugins = ["sdk", "whatsapp-rust/plugins"]
voip-control = ["sdk", "whatsapp-rust/voip-control"]
voip-runtime = ["voip-control", "whatsapp-rust/voip-runtime"]
voip-mlow = ["voip-control", "whatsapp-rust/voip-mlow"]
requests = ["sdk"]
js = ["wacore/js"]
sqlite = ["sdk", "whatsapp-rust/sqlite-storage", "dep:whatsapp-rust-sqlite-storage", "dep:tokio"]

removed-video-state = ["voip-control"]

old-image-literal = ["sdk"]

old-video-literal = ["sdk"]

old-document-literal = ["sdk"]

old-audio-literal = ["sdk"]

old-catalog-literal = ["sdk"]

old-collection-literal = ["sdk"]

old-cache-config-literal = ["sdk"]

old-cache-entry-literal = ["sdk"]

old-cache-stores-literal = ["sdk"]

exhaustive-product-availability = ["sdk"]

old-message-id-string = ["sdk"]

old-revoke-string = ["sdk"]

wrong-message-id-domain = ["sdk"]

wrong-stanza-id-domain = ["sdk"]

old-options-literal = ["sdk"]

[dependencies]
wacore = { path = "../../wacore", default-features = false }
wacore-binary = { path = "../../wacore/binary" }
whatsapp-rust = { path = "../..", default-features = false, optional = true }
futures = { version = "0.3", features = ["executor"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
anyhow = { version = "1", optional = true }
async-channel = { version = "2.5", optional = true }
async-trait = { version = "0.1.91", optional = true }
tokio = { version = "1.53.1", features = ["macros", "rt", "time"], optional = true }
whatsapp-rust-sqlite-storage = { path = "../../storages/sqlite-storage", default-features = false, features = ["bundled-sqlite"], optional = true }

[target.'cfg(target_arch = "wasm32")'.dependencies]
whatsapp-rust-sqlite-storage = { path = "../../storages/sqlite-storage", default-features = false, features = ["wasm-test"], optional = true }

[[bin]]
name = "encapsulation_probe"
path = "src/encapsulation/size_probe.rs"
required-features = ["sdk"]

[[bin]]
name = "events"
path = "src/events/probe.rs"
required-features = ["sdk"]

[[bin]]
name = "event_kinds"
path = "src/event_kinds/probe.rs"
required-features = ["sdk"]

[[bin]]
name = "lifecycle_graph"
path = "src/lifecycle_graph/probe.rs"
required-features = ["sdk"]

[[bin]]
name = "mex_probe"
path = "src/mex/size_probe.rs"
required-features = ["sdk"]

[[bin]]
name = "pictures"
path = "src/pictures/probe.rs"
required-features = ["sdk"]

[[bin]]
name = "requests_probe"
path = "src/requests/size_probe.rs"
required-features = ["sdk"]

[[bin]]
name = "voip_control"
path = "src/voip_control/probe.rs"
required-features = ["voip-control"]

[[bin]]
name = "groups_lookup_probe"
path = "src/groups_lookup/size_probe.rs"
required-features = ["sdk"]

[[bin]]
name = "sqlite"
path = "src/sqlite/probe.rs"
required-features = ["sqlite"]

[[bin]]
name = "download_probe"
path = "src/download/size_probe.rs"
required-features = ["core"]
