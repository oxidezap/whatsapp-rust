name: Inspect qualification CPU profiles

on:
  push:
    branches: [qualify/inspect-v17-cpu-profiles-oct09]

permissions:
  contents: read
  actions: read

jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        pr: [1676, 1694, 1679]
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - name: Download preserved CPU pair
        uses: actions/download-artifact@v8
        with:
          name: cpu-pair-${{ matrix.pr }}-37918372525
          run-id: 37918372525
          github-token: ${{ secrets.GITHUB_TOKEN }}
          path: _profiles
          digest-mismatch: error
      - name: Inspect original captured profiles
        run: |
          rustc --edition 2024 tools/inspect_cpu_profile.rs -o /tmp/inspect-cpu-profile
          /tmp/inspect-cpu-profile _profiles plaintext_ownership_controls
