permissions:
  contents: read
name: WASM Build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

concurrency:
  # Grouped and scoped exactly as main.yml's concurrency block, for the reasons
  # given there.
  group: wasm-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # The target dir is restored fresh each run (Swatinem cache), so incremental
  # state is always cold and only bloats artifacts; worse, sccache refuses to
  # cache incremental compilations, so leaving it on excludes the workspace
  # crates from caching entirely.
  CARGO_INCREMENTAL: "0"

jobs:
  wasm:
    name: Build whatsapp-rust (wasm32, release)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
          targets: wasm32-unknown-unknown
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      # Cache the target dir too: sccache can't cache proc-macros, build scripts
      # or bins (linker-output crate types), and those recompile every run.
      # Swatinem restores them; sccache still fills in after a Cargo.lock change.
      - name: Cache Rust build (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
      # Mirrors how whatsapp-rust-bridge consumes the crate: lib only (the
      # binary pulls tokio/sqlite), no default features. Guards against code
      # reachable from wasm regressing on tokio/std-only APIs.
      # getrandom needs both the wasm_js feature (declared for wasm32 in
      # Cargo.toml) and this backend cfg.
      - name: Build whatsapp-rust lib for wasm32 (release)
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: >
          cargo build -p whatsapp-rust --lib --release
          --target wasm32-unknown-unknown
          --no-default-features
      # The SQLite store reaches wasm through `storages/sqlite-storage/src/pool.rs`,
      # which swaps r2d2 and tokio's blocking pool for a single connection behind a
      # lock. Both of those type-check on wasm and only fail when a thread is actually
      # spawned, so this build cannot observe the regression it guards against — the
      # grep step below is what does. This step guards the rest: a dependency or an API
      # that does not exist on wasm at all.
      - name: Build sqlite-storage for wasm32 (release)
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: >
          cargo build -p whatsapp-rust-sqlite-storage --lib --release
          --target wasm32-unknown-unknown
          --no-default-features --features wacore/js
      # r2d2's pool and tokio's `spawn_blocking` both panic on a page, and both
      # compile there, so nothing but this check keeps them from creeping back into
      # the store once the shim exists.
      - name: Guard sqlite-storage's platform shim
        run: |
          # Two shapes, because an import renames the call site: the qualified call,
          # and any `use` that could bring either name into scope unqualified.
          if grep -rnE --include='*.rs' \
              -e 'tokio::task::spawn_blocking' \
              -e 'r2d2::Pool' \
              -e '^[[:space:]]*use .*tokio::task' \
              -e '^[[:space:]]*use .*r2d2::\{[^}]*Pool' \
              storages/sqlite-storage/src | grep -v '^storages/sqlite-storage/src/pool.rs:'; then
            echo "::error::use crate::pool (spawn_blocking / Pool) instead; only pool.rs may name the native ones"
            exit 1
          fi
      # The sans-IO VoIP core (wacore::voip: the CallEngine, the portable run_call driver,
      # the RelayTransport seam, the MLow codec, SRTP/SFrame crypto) must stay wasm-buildable
      # so a browser front end can drive 1:1 calls.
      - name: Build wacore VoIP core for wasm32 (release)
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: >
          cargo build -p wacore --lib --release
          --target wasm32-unknown-unknown
          --no-default-features --features "voip,js"
      # And the half above it: signaling, the facade, `CallHandle` -- everything a consumer
      # actually places a call through. It builds here because `voip-runtime` no longer carries the
      # native relay dialer (that is `voip-relay-native`, and it is the one thing that still
      # compile_error!s on this target), so what a page supplies is a `RelayTransportProvider` and
      # not a reimplementation of the call flow. Without this step that split silently regresses the
      # first time something in the facade reaches for a socket or a clock.
      - name: Build whatsapp-rust VoIP runtime for wasm32 (release)
        env:
          RUSTFLAGS: '--cfg getrandom_backend="wasm_js"'
        run: >
          cargo build -p whatsapp-rust --lib --release
          --target wasm32-unknown-unknown
          --no-default-features --features voip-mlow
