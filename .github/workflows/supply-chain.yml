permissions:
  contents: read
name: Supply Chain

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:
    inputs:
      release-check:
        type: boolean
        default: false
  workflow_dispatch:
  # RUSTSEC advisories land against a lockfile that has not changed, so the
  # audit needs a clock of its own rather than only PR triggers.
  schedule:
    - cron: '0 6 * * 1'

concurrency:
  # Grouped and scoped exactly as main.yml's concurrency block, for the reasons
  # given there.
  group: supply-chain-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  # Keep in sync with PROTOC_VERSION in main.yml — env is per-workflow, so the
  # value cannot be shared across files without a repo-level Actions variable.
  PROTOC_VERSION: '3.25.3'

jobs:
  cargo-deny:
    name: Cargo Deny
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - name: Install cargo-deny
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-deny
      # No build here: cargo-deny resolves the graph from Cargo.lock, so it
      # needs neither protoc nor ALSA nor a warm target dir.
      - name: Run cargo-deny
        run: cargo deny --locked --all-features check
      - name: Audit host tooling dependencies
        run: cargo deny --locked --manifest-path tools/oracle-task/Cargo.toml --all-features check

  compatibility:
    name: Compatibility and packages (${{ matrix.lane }})
    runs-on: ubuntu-latest
    env:
      LANE: ${{ matrix.lane }}
      TOOLCHAIN: ${{ matrix.toolchain }}
      # Candidate profiles and external package consumers compile separate graphs.
      # Keep their generated protocol artifacts within hosted runner disk limits.
      CARGO_INCREMENTAL: "0"
      CARGO_PROFILE_DEV_DEBUG: "1"
    strategy:
      fail-fast: false
      matrix:
        include:
          - lane: native
            toolchain: 1.100.0
          - lane: msrv
            toolchain: 1.95.0
          - lane: wasm
            toolchain: 1.95.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
          targets: wasm32-unknown-unknown
      - uses: dtolnay/rust-toolchain@1.95.0
        if: matrix.lane != 'native'
        with:
          targets: wasm32-unknown-unknown
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - name: Install cargo-semver-checks
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-semver-checks
      - name: Install WASM consumer test runner
        if: matrix.lane == 'wasm'
        uses: taiki-e/install-action@v2
        with:
          tool: wasm-bindgen-cli@0.2.129
      - name: Cache Rust build (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          # MSRV and WASM use the same driver toolchain and otherwise write
          # one immutable cache key. Keep both lanes' build artifacts.
          key: compatibility-${{ matrix.lane }}
      - name: Build the qualification driver
        run: cargo +1.100.0 build --locked -p whatsapp-xtask
      - name: Validate contracts before release
        if: inputs.release-check
        run: target/debug/whatsapp-xtask ci compatibility --release --lane "$LANE" --toolchain "$TOOLCHAIN"
      - name: Validate candidate or frozen contracts
        if: ${{ !inputs.release-check }}
        run: target/debug/whatsapp-xtask ci compatibility --lane "$LANE" --toolchain "$TOOLCHAIN"
      - name: Reclaim completed consumer build artifacts
        # Package consumers use an independent temporary target directory.
        # The completed checkout consumers are not reused by the remaining checks.
        run: |
          rm -rf -- target/consumers
          df -h .
      - name: Qualify distributed artifacts outside the checkout
        run: target/debug/whatsapp-xtask ci package-consumers --lane "$LANE" --toolchain "$TOOLCHAIN"
      - name: Prove SDK and host breaks fail downstream compilation
        if: matrix.lane != 'msrv'
        run: target/debug/whatsapp-xtask ci compatibility-controls --lane "$LANE" --toolchain "$TOOLCHAIN"
      - name: Record exact source commit
        env:
          EXPECTED_SHA: ${{ github.event.pull_request.head.sha || github.sha }}
        run: target/debug/whatsapp-xtask ci workflow qualification-sha
