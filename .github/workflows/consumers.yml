name: API Consumers

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_call:

permissions:
  contents: read

concurrency:
  group: api-consumers-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  CARGO_TERM_COLOR: always
  CARGO_BUILD_JOBS: "1"
  CARGO_INCREMENTAL: "0"
  RUSTFLAGS: ""
  CARGO_ENCODED_RUSTFLAGS: ""

jobs:
  qualify:
    name: API hosts
    uses: ./.github/workflows/consumer-hosts.yml
