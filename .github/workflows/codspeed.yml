name: Inspect existing CodSpeed profiles
on:
  push:
    branches: [qualify/profile-functions-v54-oct09]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      A02_PAIR_HEAD_SHA: 2037acbc80cb800605e36a999acb0d848b92b6a4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: actions/download-artifact@v8
        with:
          name: cpu-pair-current-fresh-v54-37966682008
          run-id: 37966682008
          github-token: ${{ github.token }}
          path: _a02_profiles
      - name: Validate existing pair and print exclusive function costs
        run: cargo run --locked -p whatsapp-xtask -- ci codspeed-pair function-costs
