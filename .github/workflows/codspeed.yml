name: Android SDK disk probe

on: workflow_dispatch

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  PROTOC_VERSION: '3.25.3'
  SCCACHE_GHA_ENABLED: "true"
  RUSTC_WRAPPER: "sccache"
  # The target dir is restored fresh each run (Swatinem cache), so incremental
  # state is always cold and only bloats artifacts; worse, sccache refuses to
  # cache incremental compilations, so leaving it on excludes the workspace
  # crates from caching entirely.
  CARGO_INCREMENTAL: "0"

jobs:
  test:
    name: Build & Test
    # Keep ALSA-dependent builds on a fixed Ubuntu LTS release.
    runs-on: ubuntu-24.04
    # Retain backtraces while keeping workspace test artifacts within runner disk limits.
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Sample root disk before setup
        run: |
          df -h /
          # shellcheck disable=SC2016
          nohup bash -c 'while true; do
            printf "%s " "$(date +%s)"
            df -B1 --output=avail / | tail -1
            sleep 1
          done' </dev/null > "$RUNNER_TEMP/free-disk-samples.txt" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/free-disk-sampler.pid"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      # The voip example (built under --all-targets) links cpal, which needs ALSA headers.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      # cargo-nextest ships pre-built binaries (nexte.st/docs/installation/pre-built-binaries),
      # which is what install-action fetches — no compile step on the runner.
      - name: Install protoc and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }},cargo-nextest
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      # Cache the target dir too: sccache can't cache proc-macros, build scripts
      # or bins (linker-output crate types), and those recompile every run.
      # Swatinem restores them; sccache still fills in after a Cargo.lock change.
      - name: Cache Rust build (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
      # No separate build step. There used to be one, and it was pure waste: in
      # three different spellings, `cargo build --all-targets`, `cargo test
      # --all-targets --no-run`, and finally nextest's own `--no-run` build, the
      # step below went on to recompile the same thirteen crates anyway. Measured
      # on the runner with the last of those, which differs from the step below
      # only by `--no-run`: 223s to build, then 189s recompiling before the first
      # test ran. Whatever cargo is keying on there, nothing the build step
      # produced was reusable, so the workspace is compiled once, here.
      #
      # What that gives up is a job whose default-feature targets all link:
      # benches and examples are not test targets, so nextest does not build
      # them. `Clippy Linter` still compiles them on this same push, and `Build &
      # Lint (all features)` still links them with all features on. The seam left
      # is a target that links with all features and not with the default set.
      - name: Run tests
        env:
          NEXTEST_PROFILE: ci
          TEST_TIMINGS_DIR: ${{ runner.temp }}/test-timings
        run: cargo xt ci nextest-timed workspace -- --workspace --exclude e2e-tests
      - name: Publish test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-build-and-test
          path: ${{ runner.temp }}/test-timings
          retention-days: 14
          if-no-files-found: warn
          # v4 artifacts are immutable and scoped to the run, not the attempt,
          # and `if: always()` means attempt 1 uploaded even when it failed. So
          # a rerun of a failed job would 409 here and finish red with green
          # tests, which is the opposite of what these reports are for. Same
          # reason on every timing upload below and in e2e.yml.
          overwrite: true
      # nextest cannot run doctests (nextest-rs/nextest#16) and silently reports
      # none, so they need their own libtest step — the workspace has ~200 doc
      # examples whose compilation is asserted nowhere else.
      - name: Run doctests
        run: cargo test --workspace --exclude e2e-tests --doc --verbose
      - name: Report lowest sampled free disk space
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/free-disk-sampler.pid")" || true
          wc -l "$RUNNER_TEMP/free-disk-samples.txt"
          head -1 "$RUNNER_TEMP/free-disk-samples.txt"
          sort -nk2 "$RUNNER_TEMP/free-disk-samples.txt" | sed -n "1p"
          df -h /
      - name: Preserve disk samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disk-samples-test
          path: ${{ runner.temp }}/free-disk-samples.txt

  test-all-features:
    name: Build & Lint (all features)
    # Keep ALSA-dependent builds on a fixed Ubuntu LTS release.
    runs-on: ubuntu-24.04
    # The all-targets build filled the hosted runner's disk on a cold cache.
    # Retain limited debug info for backtraces; keep assertions and optimization defaults.
    env:
      CARGO_PROFILE_DEV_DEBUG: "1"
      CARGO_PROFILE_TEST_DEBUG: "1"
    # Runs on every PR (no voip path filter): the voip-gated code is scattered across the client,
    # handler, send and stanza layers, so enumerating its files in a path filter kept leaking. The
    # webrtc/opus tree compiles once and is cached (sccache), so the steady-state cost is the
    # workspace recompile with voip on, not the deps. The heavy relay e2e tests stay out of `--lib`.
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Sample root disk before setup
        run: |
          df -h /
          # shellcheck disable=SC2016
          nohup bash -c 'while true; do
            printf "%s " "$(date +%s)"
            df -B1 --output=avail / | tail -1
            sleep 1
          done' </dev/null > "$RUNNER_TEMP/free-disk-samples.txt" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/free-disk-sampler.pid"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      # The voip example (built under --all-features --all-targets) links cpal,
      # which needs ALSA on Linux.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install protoc and cargo-nextest
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }},cargo-nextest
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      # Cache the target dir too: sccache can't cache proc-macros, build scripts
      # or bins (linker-output crate types), and those recompile every run.
      # Swatinem restores them; sccache still fills in after a Cargo.lock change.
      - name: Cache Rust build (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
          # The large PR archive is only reusable within that same PR.
          save-if: ${{ github.event_name != 'pull_request' }}
      - name: Build (all features)
        run: cargo build --workspace --exclude e2e-tests --all-features --all-targets --verbose
      - name: Clippy (all features)
        run: cargo clippy --workspace --exclude e2e-tests --all-features --all-targets -- -D warnings
      # There is no `cargo test --all-features` because a few features cannot
      # share a build with the rest. `cargo xt ci test-features` derives the
      # set that can from cargo metadata and carries the exclusions with their
      # reasons, so a feature added tomorrow is tested without editing CI.
      # Compiling a test is not running it: the two `--all-features` steps above
      # build the codec suite, its golden checksums and every C/Go ground-truth
      # vector among them, but nothing executed them until a step actually
      # enabled `voip-mlow` and ran it. That is what this loop does.
      - name: Test (every shareable feature)
        env:
          NEXTEST_PROFILE: ci
          TEST_TIMINGS_DIR: ${{ runner.temp }}/test-timings
        # wacore/mobile and transport/tcp are off by default. Include both
        # owners here so their unit tests execute, rather than only compiling
        # through all-features or constructing a factory in an API consumer.
        run: cargo xt ci test-feature-packages wacore wacore-libsignal whatsapp-rust whatsapp-rust-tokio-transport
      - name: Publish test timings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-timings-all-features
          path: ${{ runner.temp }}/test-timings
          retention-days: 14
          if-no-files-found: warn
          overwrite: true
      - name: Report lowest sampled free disk space
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/free-disk-sampler.pid")" || true
          wc -l "$RUNNER_TEMP/free-disk-samples.txt"
          head -1 "$RUNNER_TEMP/free-disk-samples.txt"
          sort -nk2 "$RUNNER_TEMP/free-disk-samples.txt" | sed -n "1p"
          df -h /
      - name: Preserve disk samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disk-samples-test-all-features
          path: ${{ runner.temp }}/free-disk-samples.txt

  rustdoc:
    name: Rustdoc
    # Keep ALSA-dependent builds on a fixed Ubuntu LTS release.
    runs-on: ubuntu-24.04
    env:
      # Broken intra-doc links and malformed doc attributes are only surfaced by
      # rustdoc, never by clippy or rustc, so they need their own gate.
      RUSTDOCFLAGS: "-D warnings"
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Sample root disk before setup
        run: |
          df -h /
          # shellcheck disable=SC2016
          nohup bash -c 'while true; do
            printf "%s " "$(date +%s)"
            df -B1 --output=avail / | tail -1
            sleep 1
          done' </dev/null > "$RUNNER_TEMP/free-disk-samples.txt" 2>&1 &
          echo "$!" > "$RUNNER_TEMP/free-disk-sampler.pid"
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      # The voip-cli member links cpal, which needs ALSA headers.
      - name: Install ALSA dev headers
        run: sudo apt-get update && sudo apt-get install -y libasound2-dev
      - name: Install protoc
        uses: taiki-e/install-action@v2
        with:
          tool: protoc@${{ env.PROTOC_VERSION }}
      - name: Setup sccache
        uses: mozilla-actions/sccache-action@v0.0.11
      # Cache the target dir too: sccache can't cache proc-macros, build scripts
      # or bins (linker-output crate types), and those recompile every run.
      # Swatinem restores them; sccache still fills in after a Cargo.lock change.
      - name: Cache Rust build (registry + target)
        uses: Swatinem/rust-cache@v2
        with:
          cache-targets: "true"
      # --all-features so the voip-gated docs are covered too. Default features
      # alone would leave their links unchecked, and docs.rs builds with features
      # on (hence the `cfg(docsrs)` in the workspace check-cfg).
      - name: Build docs
        run: cargo doc --workspace --no-deps --all-features
      - name: Report lowest sampled free disk space
        if: always()
        run: |
          kill "$(cat "$RUNNER_TEMP/free-disk-sampler.pid")" || true
          wc -l "$RUNNER_TEMP/free-disk-samples.txt"
          head -1 "$RUNNER_TEMP/free-disk-samples.txt"
          sort -nk2 "$RUNNER_TEMP/free-disk-samples.txt" | sed -n "1p"
          df -h /
      - name: Preserve disk samples
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: disk-samples-rustdoc
          path: ${{ runner.temp }}/free-disk-samples.txt
