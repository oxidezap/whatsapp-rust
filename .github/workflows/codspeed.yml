name: Inspect existing CodSpeed profiles
on:
  push:
    branches: [qualify/profile-functions-v50-oct09]
permissions:
  contents: read
  actions: read
jobs:
  inspect:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    env:
      A02_PAIR_HEAD_SHA: 392d600d52a1b106519628bf0d385207e813aee4
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: actions/download-artifact@v8
        with:
          name: cpu-pair-fresh-decode-v50-37963875851
          run-id: 37963875851
          github-token: ${{ github.token }}
          path: _a02_profiles
      - name: Validate existing pair and print exclusive function costs
        run: cargo run --locked -p whatsapp-xtask -- ci codspeed-pair function-costs
