name: VoIP conformance

on:
  push:
    paths: ['wacore/src/voip/mlow/**', 'scripts/mlow-vectors/**', 'tools/oracle-*/**', 'tools/xtask*/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', '.config/nextest.toml', '.github/workflows/mlow-derive.yml']
  pull_request:
    paths: ['wacore/src/voip/mlow/**', 'scripts/mlow-vectors/**', 'tools/oracle-*/**', 'tools/xtask*/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', '.config/nextest.toml', '.github/workflows/mlow-derive.yml']
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  tooling:
    name: Oracle tooling checks
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: rederive
          workspaces: . -> target
      - name: Lint oracle tooling
        run: cargo clippy --locked --release -p oracle-core -p oracle-cli -p whatsapp-oracle-task --all-targets -- -D warnings
      - name: Test native task utilities
        run: cargo test --locked -p whatsapp-xtask -p xtask-support
      - name: Test oracle task utilities
        run: cargo test --release --locked -p whatsapp-oracle-task

  rederive:
    needs: tooling
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      # Preserve the existing required check when a prerequisite fails or skips.
      - name: Require successful tooling checks
        if: ${{ needs.tooling.result != 'success' }}
        run: exit 1
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.sha }}
          persist-credentials: false
      - name: Record tested revision
        run: git rev-parse HEAD
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          # Reuse the tooling job's dependencies and the previous job's cache key.
          shared-key: rederive
          workspaces: . -> target
      - name: Cache pinned WASM captures
        uses: actions/cache@v6
        with:
          path: .cache/wa-wasm
          key: voip-captures-${{ hashFiles('tools/oracle-core/wasm.lock.json') }}
      - name: Restore pinned WASM captures
        # Authenticate release lookup without passing the token to the oracles.
        env:
          GH_TOKEN: ${{ github.token }}
        run: cargo xt oracle fetch
      - name: Run complete VoIP conformance gate with slow signaling
        run: cargo xt oracle conformance --slow
      - uses: actions/upload-artifact@v7
        # Early failures can precede derivation. Preserve partial evidence on
        # failure, but a successful gate must still produce uploadable evidence.
        if: ${{ always() && (success() || hashFiles('.derive-mlow/specs/*.json', '.derive-mlow/wasm/*.log', '.derive-mlow/wasm/*/manifest.json', 'target/nextest/oracle/junit.xml') != '') }}
        with:
          name: voip-conformance-evidence
          path: |
            .derive-mlow/specs/*.json
            .derive-mlow/wasm/*.log
            .derive-mlow/wasm/*/manifest.json
            target/nextest/oracle/junit.xml
          if-no-files-found: error
          include-hidden-files: true
