name: MLOW oracle fixtures

on:
  push:
    paths: ['wacore/src/voip/mlow/**', 'scripts/mlow-vectors/**', 'tools/oracle-*/**', 'tools/xtask*/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', '.github/workflows/mlow-derive.yml']
  pull_request:
    paths: ['wacore/src/voip/mlow/**', 'scripts/mlow-vectors/**', 'tools/oracle-*/**', 'tools/xtask*/**', 'Cargo.toml', 'Cargo.lock', '.cargo/config.toml', '.github/workflows/mlow-derive.yml']
  workflow_dispatch:
  schedule:
    - cron: '19 6 * * 1'

permissions:
  contents: read

jobs:
  rederive:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly-2026-06-16
      - uses: taiki-e/install-action@v2
        with:
          tool: protoc@3.25.3,cargo-nextest
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: . -> target
      - name: Test the WhatsApp wasm oracle
        run: cargo test --release --locked -p oracle-core --lib
      - name: Test native task utilities
        run: cargo test --locked -p whatsapp-xtask -p xtask-support
      - name: Re-derive J/S and compare every committed wasm fixture
        run: cargo xt mlow regenerate --check
      - name: Test the runtime against the regenerated corpus
        run: cargo nextest run --profile ci --locked -p wacore --features voip-mlow --lib -E 'test(voip::mlow::)'
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: mlow-oracle-evidence
          path: |
            .derive-mlow/wasm/*.log
            .derive-mlow/wasm/*/manifest.json
          if-no-files-found: error
          include-hidden-files: true
