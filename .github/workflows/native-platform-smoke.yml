name: Native platform smoke check

on:
  workflow_dispatch:
  pull_request:
    paths:
      - '.github/workflows/native-platform-smoke.yml'

permissions:
  contents: read

jobs:
  default-sdk:
    name: Default SDK check on ${{ matrix.runner }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, windows-2025]
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.100.0
      - run: cargo check --locked -p whatsapp-rust --lib
