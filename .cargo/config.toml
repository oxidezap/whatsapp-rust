[alias]
xt = "run --quiet -p whatsapp-xtask --"

# Workspace build configuration. Applies to builds of THIS repo only —
# crates.io consumers are unaffected (cargo does not inherit this file
# across package boundaries).

[target.x86_64-unknown-linux-gnu]
# Rust 1.100 uses bundled rust-lld by default on this target. Retain ICF
# without nightly flags. MSRV and interpreted Miri jobs may clear RUSTFLAGS.
# -Zshare-generics is deliberately absent so normal builds use stable Rust.
rustflags = ["-Clink-arg=-Wl,--icf=all"]

[env]
# Trim bundled-SQLite subsystems the workspace never touches. FTS5 stays:
# nothing here builds an index on it today, but it is the one subsystem an
# embedder is likely to want from this crate's bundled SQLite, and this file
# is not inherited by consumers — so keeping it is what proves it still
# compiles. Shared cache stays: sqlite-storage's in-memory mode shares one DB
# across the pool via `cache=shared` URIs. JSON and extension loading are
# unused by diesel/sqlite-storage (checked: no json_* SQL, no
# load_extension callers); dropping loadable extensions also removes a
# dlopen surface. STAT4/DBSTAT/RTREE/FTS3/SOUNDEX are upstream-default-off
# features libsqlite3-sys turns on; none are exercised here.
# The progress callback stays: Diesel 2.4 registers and resets a progress
# handler on every connection, so omitting it fails to link.
LIBSQLITE3_FLAGS = "-USQLITE_ENABLE_FTS3 -USQLITE_ENABLE_FTS3_PARENTHESIS -USQLITE_ENABLE_RTREE -USQLITE_ENABLE_STAT4 -USQLITE_ENABLE_DBSTAT_VTAB -USQLITE_SOUNDEX -DSQLITE_OMIT_JSON -DSQLITE_OMIT_LOAD_EXTENSION -DSQLITE_OMIT_DEPRECATED"
