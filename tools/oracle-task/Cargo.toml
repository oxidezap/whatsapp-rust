[package]
name = "whatsapp-oracle-task"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false
license = "MIT"

[dependencies]
anyhow = { workspace = true, features = ["std"] }
clap = { version = "4", features = ["derive"] }
serde = { workspace = true, features = ["derive"] }
serde_json = { workspace = true, features = ["std", "float_roundtrip"] }
xtask-support = { workspace = true, features = ["compression"] }
oracle-core.workspace = true
wa-store.workspace = true
wasm-encoder.workspace = true
wasmparser.workspace = true
tempfile = "3"
hex.workspace = true

[lints]
workspace = true
