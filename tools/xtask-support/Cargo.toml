[package]
name = "xtask-support"
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
publish = false
license.workspace = true

[features]
default = []
compression = ["dep:zstd"]

[dependencies]
anyhow = "1"
hex = "0.4.3"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["float_roundtrip"] }
sha2 = "0.11"
zstd = { version = "0.13.3", optional = true }
tempfile = "3"

[lints]
workspace = true
